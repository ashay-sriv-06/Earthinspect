# Render Blueprint: one Docker web service on the FREE plan.
# Deploy: Render dashboard → New → Blueprint → select this GitHub repo → Apply.
# Free plan notes (honest limits):
#  - No persistent disk: SQLite/artifacts live in the container and reset on every restart or redeploy.
#    The four case files still work (NASA data is re-fetched or read from shipped real snapshots in
#    backend/snapshots), and visitors can always click "Open demo investigation".
#  - Free instances sleep after ~15 min idle; the first visit afterwards takes ~1 minute to wake.
#  - To keep data across restarts, switch to a paid instance and add a `disk:` mounted at /data.
services:
  - type: web
    name: earthinspect
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: EARTHINSPECT_DATA_DIR
        value: /data
      - key: ANTHROPIC_API_KEY
        sync: false   # optional; leave empty to keep the copilot in Guided analysis mode (no paid model calls)
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
