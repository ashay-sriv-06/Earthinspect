# Render Blueprint: one Docker web service + persistent disk for SQLite and NASA artifacts.
# Deploy: push this repo to GitHub, then Render dashboard → New → Blueprint → select the repo.
# Note: persistent disks require a paid instance type on Render. On a free instance, delete the
# `disk` block. Data then resets on every restart, and the shipped NASA snapshots in
# backend/snapshots keep the four seed cases working.
services:
  - type: web
    name: earthinspect
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: EARTHINSPECT_DATA_DIR
        value: /data
      - key: ANTHROPIC_API_KEY
        sync: false   # optional; set in the dashboard to enable the LLM copilot
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
    disk:
      name: earthinspect-data
      mountPath: /data
      sizeGB: 1
